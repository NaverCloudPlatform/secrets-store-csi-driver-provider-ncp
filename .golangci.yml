version: "2"

run:
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - bodyclose
    - nilerr
    - errorlint
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # Test code routinely ignores Encode/Decode/Write errors on httptest
      # fixtures; suppress errcheck noise there but keep it strict elsewhere.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/NaverCloudPlatform/secrets-store-csi-driver-provider-ncp
