apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: my-secret
spec:
  provider: ncp
  parameters:
    objects: |
      # Whole secret (key/value JSON) mounted as one file.
      - objectName: "my-secret"
        objectType: "secretmanager"
        path: "my-secret.txt"
      # Single key extracted from the JSON secret.
      - objectName: "my-secret"
        objectType: "secretmanager"
        secretKey: "id"
        path: "id.txt"
