apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
    - name: my-pod
      image: busybox
      command: ["sleep", "1000000"]
      volumeMounts:
        - name: my-secret
          mountPath: /var/secrets
          readOnly: true
  volumes:
    - name: my-secret
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: my-secret
