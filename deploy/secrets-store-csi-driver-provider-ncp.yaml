# NCP provider for the Secrets Store CSI Driver.
# Runs as a DaemonSet and serves a gRPC socket the driver talks to.
# Prereqs: secrets-store-csi-driver installed, and a credential Secret:
#   kubectl -n kube-system create secret generic ncp-secrets-store-credentials --from-file=./configure
# (see examples/configure.example)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-store-csi-driver-provider-ncp
  namespace: kube-system
# Provider makes no Kubernetes API calls, so no token is needed.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: secrets-store-csi-driver-provider-ncp
  namespace: kube-system
  labels:
    app: secrets-store-csi-driver-provider-ncp
spec:
  selector:
    matchLabels:
      app: secrets-store-csi-driver-provider-ncp
  template:
    metadata:
      labels:
        app: secrets-store-csi-driver-provider-ncp
    spec:
      serviceAccountName: secrets-store-csi-driver-provider-ncp
      # Without this the provider is among the first pods evicted under node
      # memory pressure, which stops every secret mount on that node.
      priorityClassName: system-node-critical
      containers:
        - name: secrets-store-csi-driver-provider-ncp
          image: nks.kr.ncr.ntruss.com/secrets-store-csi-driver-provider-ncp:v1.0.0
          # Using the NKS node server role instead of a key file? Delete the
          # Secret and pass the API URL explicitly. The endpoint below is KR for
          # secrets under an isolated KMS key; see "Secret Manager API endpoints"
          # in the README for the global-key and JPN endpoints, whose paths differ.
          #args: ["--secretmanager-api-url=https://ocapi-kr.ncloud.com/secretmanager/api/v1"]
          # Runs as root on purpose: the gRPC socket is created inside a hostPath
          # directory that kubelet owns as root:root 0755, and hostPath ignores
          # fsGroup. Everything else is dropped; the process writes only to the
          # mounted volumes, never to the container filesystem.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Memory only: a CPU limit would throttle the mount path, which
              # kubelet is already waiting on.
              memory: 128Mi
          volumeMounts:
            # Shared socket dir; must match the driver's provider volume path.
            - name: providervol
              mountPath: /etc/kubernetes/secrets-store-csi-providers
            - name: credentials
              mountPath: /credentials
              readOnly: true
      volumes:
        - name: providervol
          hostPath:
            path: /etc/kubernetes/secrets-store-csi-providers
            type: DirectoryOrCreate
        - name: credentials
          secret:
            secretName: ncp-secrets-store-credentials
            # Optional so the DaemonSet also starts when the node's server role
            # supplies credentials instead of a mounted key file.
            optional: true
      # The provider must run on every node the driver runs on, tainted ones included.
      nodeSelector:
        kubernetes.io/os: linux
        # Released images are linux/amd64. Without this the DaemonSet is also
        # placed on arm64 nodes, where it fails to pull or to exec. Publishing a
        # multi-arch image (make docker-push PLATFORMS=linux/amd64,linux/arm64)
        # makes this line unnecessary.
        kubernetes.io/arch: amd64
      tolerations:
        - operator: Exists
